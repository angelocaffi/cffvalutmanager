networks:
  appnet:
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks:
      - appnet
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      # Exposed only so `dotnet ef database update` can run from the host to apply migrations
      # (this project never auto-migrates on startup, see CLAUDE.md). Remove this mapping once
      # the database is reachable another way, or firewall it off, in a real deployment.
      # Host port deliberately not 1433: a machine with its own local SQL Server instance (common
      # for .NET dev boxes) already owns that port, and Docker Desktop's port-forwarding silently
      # loses the race to it — connections to localhost:1433 land on the wrong SQL Server.
      - "15433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CffVaultManager.Api/Dockerfile
    networks:
      - appnet
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=sqlserver;Database=CffVaultManager;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Cors__AllowedOrigins__0: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      WebAuthn__RelyingPartyId: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      WebAuthn__Origins__0: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      # Reused for the invitation email link (UserInvitationService) — Api and Web share the same
      # public domain (see docs/deployment.md), no separate env var needed.
      App__PublicUrl: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      # Caddy is the only reverse proxy in front of this container (see the `caddy` service below,
      # static IP 172.28.0.10 on this same network) — trusting its forwarded headers is what makes
      # rate-limiting/audit IP attribution see the real client IP instead of Caddy's, see Program.cs.
      ReverseProxy__KnownProxies__0: 172.28.0.10
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUsername: ${SMTP_USERNAME:-}
      Email__SmtpPassword: ${SMTP_PASSWORD:-}
      Email__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromDisplayName: CffVault
      PayPal__BaseUrl: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:-}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET:-}
      Billing__VipEmail: ${BILLING_VIP_EMAIL:-}
      Billing__VipAnnualPrice: ${BILLING_VIP_ANNUAL_PRICE:-}
      # Must survive container recreation (rebuild/redeploy) — otherwise every MfaSecret encrypted
      # under the previous key ring becomes permanently undecryptable, locking out TOTP-only
      # accounts. See the comment on AddDataProtection in ServiceCollectionExtensions.cs.
      DataProtection__KeyPath: /keys
    volumes:
      - dataprotection-keys:/keys
    ports:
      # Not meant to be reached directly in production — only `caddy` (80/443) should be open on
      # the host's external firewall. Left published for local testing without a domain/TLS.
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: src/CffVaultManager.Web/Dockerfile
    networks:
      - appnet
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # Same caveat as api's 8080 above: local-testing convenience, not meant to be open externally.
      - "8081:8080"

  caddy:
    image: caddy:2-alpine
    networks:
      appnet:
        ipv4_address: 172.28.0.10
    depends_on:
      - api
      - web
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set CADDY_ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  sqlserver-data:
  caddy-data:
  caddy-config:
  dataprotection-keys:
